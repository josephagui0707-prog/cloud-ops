services:
  - type: web
    name: cloudops-gemini
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: VITE_SUPABASE_URL
        value: https://cfhdxujqsxllpbwmnxgx.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_WORKSPACE_ID
        value: cloudops-demo
